{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  {{ if .Pages }}
  <ul class="entry-list">
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ with .Params.date }}<span class="date"> — {{ . }}</span>{{ end }}
    </li>
    {{ end }}
  </ul>
  {{ end }}
{{ end }}
