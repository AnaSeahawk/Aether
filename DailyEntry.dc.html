<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
    body { margin: 0; font-family: 'IBM Plex Sans', 'Helvetica Neue', sans-serif; }
    a { color: #8b6f47; } a:hover { color: #6b5534; }
  </style>
</helmet>
<div style="width: 612px; height: 792px; background: #f5f0e8; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <!-- Header strip -->
  <div style="padding: 40px 56px 0; display: flex; align-items: flex-start; justify-content: space-between;">

    <!-- Left: Solar position (primary) -->
    <div>
      <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 28px; font-weight: 300; color: #3d3428; line-height: 1;">&#9737; ____&#176; ______</div>
      <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 8px; font-weight: 300; color: #8b6f47; opacity: 0.4; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 6px;">Sun position</div>
    </div>

    <!-- Right: Train time (small, secondary) -->
    <div style="text-align: right;">
      <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 9px; font-weight: 300; color: #8b6f47; opacity: 0.3; margin-bottom: 4px;">train time</div>
      <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 300; color: #3d3428; opacity: 0.3;">____ / ____ / ________</div>
    </div>
  </div>

  <!-- Thin divider -->
  <div style="margin: 20px 56px 0; height: 1px; background: linear-gradient(90deg, rgba(139,111,71,0.15), rgba(139,111,71,0.05));"></div>

  <!-- Astronomical fields row -->
  <div style="padding: 20px 56px 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 20px;">

    <!-- Moon -->
    <div>
      <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 7px; font-weight: 400; color: #8b6f47; opacity: 0.4; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;">Moon</div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <!-- Moon phase circle placeholder -->
        <svg viewBox="0 0 24 24" width="24" height="24">
          <circle cx="12" cy="12" r="10" fill="none" stroke="#8b6f47" stroke-width="0.5" opacity="0.25"/>
        </svg>
        <div>
          <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 14px; font-weight: 400; color: #3d3428; opacity: 0.5;">________</div>
          <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 8px; font-weight: 300; color: #8b6f47; opacity: 0.35; margin-top: 2px;">phase &amp; sign</div>
        </div>
      </div>
    </div>

    <!-- Solar time -->
    <div>
      <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 7px; font-weight: 400; color: #8b6f47; opacity: 0.4; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;">Solar time</div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 12 12" width="12" height="12">
            <circle cx="6" cy="8" r="3" fill="none" stroke="#8b6f47" stroke-width="0.5" opacity="0.3"/>
            <line x1="6" y1="5" x2="6" y2="3" stroke="#8b6f47" stroke-width="0.5" opacity="0.3"/>
            <line x1="3" y1="8" x2="1" y2="8" stroke="#8b6f47" stroke-width="0.4" opacity="0.2"/>
            <line x1="9" y1="8" x2="11" y2="8" stroke="#8b6f47" stroke-width="0.4" opacity="0.2"/>
          </svg>
          <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 9px; font-weight: 300; color: #3d3428; opacity: 0.45;">rise ______</div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 12 12" width="12" height="12">
            <circle cx="6" cy="6" r="3" fill="none" stroke="#8b6f47" stroke-width="0.5" opacity="0.35"/>
            <line x1="6" y1="1" x2="6" y2="3" stroke="#8b6f47" stroke-width="0.4" opacity="0.3"/>
            <line x1="6" y1="9" x2="6" y2="11" stroke="#8b6f47" stroke-width="0.4" opacity="0.3"/>
            <line x1="1" y1="6" x2="3" y2="6" stroke="#8b6f47" stroke-width="0.4" opacity="0.3"/>
            <line x1="9" y1="6" x2="11" y2="6" stroke="#8b6f47" stroke-width="0.4" opacity="0.3"/>
          </svg>
          <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 9px; font-weight: 300; color: #3d3428; opacity: 0.45;">noon ______</div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 12 12" width="12" height="12">
            <circle cx="6" cy="8" r="3" fill="none" stroke="#8b6f47" stroke-width="0.5" opacity="0.3"/>
            <line x1="6" y1="11" x2="6" y2="9" stroke="#8b6f47" stroke-width="0.5" opacity="0.3"/>
            <line x1="1" y1="8" x2="3" y2="8" stroke="#8b6f47" stroke-width="0.4" opacity="0.2"/>
            <line x1="9" y1="8" x2="11" y2="8" stroke="#8b6f47" stroke-width="0.4" opacity="0.2"/>
          </svg>
          <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 9px; font-weight: 300; color: #3d3428; opacity: 0.45;">set ______</div>
        </div>
      </div>
    </div>

    <!-- Season / Light -->
    <div>
      <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 7px; font-weight: 400; color: #8b6f47; opacity: 0.4; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;">Light</div>
      <div style="border-bottom: 1px solid rgba(139,111,71,0.12); padding-bottom: 4px; margin-bottom: 8px;">
        <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 14px; font-weight: 400; color: #3d3428; opacity: 0.5;">________________</div>
      </div>
      <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 8px; font-weight: 300; color: #8b6f47; opacity: 0.3;">quality, weather, felt sense</div>
    </div>
  </div>

  <!-- Second divider -->
  <div style="margin: 24px 56px 0; height: 1px; background: rgba(139,111,71,0.08);"></div>

  <!-- Writing space -->
  <div style="flex: 1; padding: 24px 56px 0; display: flex; flex-direction: column;">
    <!-- Ruled lines for writing - subtle -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 0;">
      <div style="border-bottom: 1px solid rgba(139,111,71,0.06); height: 28px;"></div>
      <div style="border-bottom: 1px solid rgba(139,111,71,0.06); height: 28px;"></div>
      <div style="border-bottom: 1px solid rgba(139,111,71,0.06); height: 28px;"></div>
      <div style="border-bottom: 1px solid rgba(139,111,71,0.06); height: 28px;"></div>
      <div style="border-bottom: 1px solid rgba(139,111,71,0.06); height: 28px;"></div>
      <div style="border-bottom: 1px solid rgba(139,111,71,0.06); height: 28px;"></div>
      <div style="border-bottom: 1px solid rgba(139,111,71,0.06); height: 28px;"></div>
      <div style="border-bottom: 1px solid rgba(139,111,71,0.06); height: 28px;"></div>
      <div style="border-bottom: 1px solid rgba(139,111,71,0.06); height: 28px;"></div>
      <div style="border-bottom: 1px solid rgba(139,111,71,0.06); height: 28px;"></div>
      <div style="border-bottom: 1px solid rgba(139,111,71,0.06); height: 28px;"></div>
      <div style="border-bottom: 1px solid rgba(139,111,71,0.06); height: 28px;"></div>
      <div style="border-bottom: 1px solid rgba(139,111,71,0.06); height: 28px;"></div>
    </div>
  </div>

  <!-- Footer -->
  <div style="padding: 0 56px 32px; display: flex; justify-content: space-between; align-items: center;">
    <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 7px; font-weight: 300; color: #8b6f47; opacity: 0.2; letter-spacing: 1px;">THE SOLAR JOURNAL</div>
    <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 8px; font-weight: 300; color: #8b6f47; opacity: 0.25;">____&#176;</div>
  </div>
</div>
</x-dc>
</body>
</html>
