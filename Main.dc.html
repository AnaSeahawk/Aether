<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
    body { margin: 0; font-family: 'IBM Plex Sans', 'Helvetica Neue', sans-serif; }
    a { color: #8b6f47; } a:hover { color: #6b5534; }
  </style>
</helmet>
<div style="width: 612px; height: 792px; background: #f5f0e8; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden;">

  <!-- Subtle radial texture -->
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(139,111,71,0.06) 0%, transparent 70%);"></div>

  <!-- Two-semicircle sun path sigil -->
  <div style="position: relative; width: 340px; height: 240px; display: flex; align-items: center; justify-content: center;">
    <svg viewBox="0 0 340 240" width="340" height="240" style="position: absolute; inset: 0;">

      <!-- Horizontal axis -->
      <line x1="5" y1="120" x2="335" y2="120" stroke="#8b6f47" stroke-width="0.4" opacity="0.15"/>

      <!-- Upper semicircle (light half) -->
      <path d="M 10 120 A 80 80 0 0 1 170 120" fill="none" stroke="#8b6f47" stroke-width="0.6" opacity="0.35"/>

      <!-- Lower semicircle (dark half) -->
      <path d="M 170 120 A 80 80 0 0 1 330 120" fill="none" stroke="#8b6f47" stroke-width="0.6" opacity="0.35"/>

      <!-- Faint division lines - upper (center 90,120) -->
      <line x1="90" y1="120" x2="21" y2="80"  stroke="#8b6f47" stroke-width="0.3" opacity="0.1"/>
      <line x1="90" y1="120" x2="50" y2="51"  stroke="#8b6f47" stroke-width="0.3" opacity="0.1"/>
      <line x1="90" y1="120" x2="90" y2="40"  stroke="#8b6f47" stroke-width="0.3" opacity="0.1"/>
      <line x1="90" y1="120" x2="130" y2="51" stroke="#8b6f47" stroke-width="0.3" opacity="0.1"/>
      <line x1="90" y1="120" x2="159" y2="80" stroke="#8b6f47" stroke-width="0.3" opacity="0.1"/>

      <!-- Faint division lines - lower (center 250,120) -->
      <line x1="250" y1="120" x2="181" y2="160" stroke="#8b6f47" stroke-width="0.3" opacity="0.1"/>
      <line x1="250" y1="120" x2="210" y2="189" stroke="#8b6f47" stroke-width="0.3" opacity="0.1"/>
      <line x1="250" y1="120" x2="250" y2="200" stroke="#8b6f47" stroke-width="0.3" opacity="0.1"/>
      <line x1="250" y1="120" x2="290" y2="189" stroke="#8b6f47" stroke-width="0.3" opacity="0.1"/>
      <line x1="250" y1="120" x2="319" y2="160" stroke="#8b6f47" stroke-width="0.3" opacity="0.1"/>

      <!-- Small sign glyphs along the arcs -->
      <text x="40"  y="107" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.25">&#x2648;</text>
      <text x="56"  y="82"  text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.25">&#x2649;</text>
      <text x="78"  y="66"  text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.25">&#x264A;</text>
      <text x="102" y="66"  text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.25">&#x264B;</text>
      <text x="124" y="82"  text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.25">&#x264C;</text>
      <text x="140" y="107" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.25">&#x264D;</text>

      <text x="200" y="140" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.25">&#x264E;</text>
      <text x="216" y="162" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.25">&#x264F;</text>
      <text x="238" y="178" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.25">&#x2650;</text>
      <text x="262" y="178" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.25">&#x2651;</text>
      <text x="284" y="162" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.25">&#x2652;</text>
      <text x="300" y="140" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.25">&#x2653;</text>

      <!-- Cardinal dots -->
      <circle cx="10"  cy="120" r="1.5" fill="#8b6f47" opacity="0.2"/>
      <circle cx="170" cy="120" r="1.5" fill="#8b6f47" opacity="0.2"/>
      <circle cx="330" cy="120" r="1.5" fill="#8b6f47" opacity="0.2"/>
      <circle cx="90"  cy="40"  r="1.5" fill="#8b6f47" opacity="0.2"/>
      <circle cx="250" cy="200" r="1.5" fill="#8b6f47" opacity="0.2"/>
    </svg>
  </div>

  <!-- Title text below the sigil -->
  <div style="position: relative; z-index: 1; text-align: center; margin-top: 28px;">
    <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 11px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; color: #8b6f47; opacity: 0.5; margin-bottom: 16px;">The</div>
    <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 38px; font-weight: 300; letter-spacing: 1px; color: #3d3428; line-height: 1.1;">Solar</div>
    <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 38px; font-weight: 300; letter-spacing: 1px; color: #3d3428; line-height: 1.1;">Journal</div>
    <div style="width: 40px; height: 1px; background: #8b6f47; opacity: 0.3; margin: 16px auto;"></div>
    <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 13px; font-weight: 300; letter-spacing: 2px; color: #8b6f47; opacity: 0.5;">1&#176;&#8211;360&#176;</div>
  </div>

  <!-- Bottom text -->
  <div style="position: absolute; bottom: 56px; text-align: center;">
    <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 9px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; color: #8b6f47; opacity: 0.35;">A record in natural time</div>
  </div>
</div>
</x-dc>
</body>
</html>
