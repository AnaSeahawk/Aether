<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
    body { margin: 0; font-family: 'IBM Plex Sans', 'Helvetica Neue', sans-serif; }
    a { color: #8b6f47; } a:hover { color: #6b5534; }
  </style>
</helmet>
<div style="width: 612px; height: 792px; background: #f5f0e8; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden;">

  <!-- Subtle radial texture -->
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(139,111,71,0.06) 0%, transparent 70%);"></div>

  <!-- Outer circle -->
  <div style="position: relative; width: 340px; height: 340px; display: flex; align-items: center; justify-content: center;">
    <svg viewBox="0 0 340 340" width="340" height="340" style="position: absolute; inset: 0;">
      <!-- Outer ring -->
      <circle cx="170" cy="170" r="165" fill="none" stroke="#8b6f47" stroke-width="0.5" opacity="0.4"/>
      <circle cx="170" cy="170" r="155" fill="none" stroke="#8b6f47" stroke-width="0.3" opacity="0.25"/>

      <!-- Degree marks - 360 tiny ticks -->
      <g opacity="0.2">
        <line x1="170" y1="6" x2="170" y2="10" stroke="#8b6f47" stroke-width="0.3" transform="rotate(0, 170, 170)"/>
        <line x1="170" y1="6" x2="170" y2="12" stroke="#8b6f47" stroke-width="0.5" transform="rotate(30, 170, 170)"/>
        <line x1="170" y1="6" x2="170" y2="12" stroke="#8b6f47" stroke-width="0.5" transform="rotate(60, 170, 170)"/>
        <line x1="170" y1="6" x2="170" y2="12" stroke="#8b6f47" stroke-width="0.5" transform="rotate(90, 170, 170)"/>
        <line x1="170" y1="6" x2="170" y2="12" stroke="#8b6f47" stroke-width="0.5" transform="rotate(120, 170, 170)"/>
        <line x1="170" y1="6" x2="170" y2="12" stroke="#8b6f47" stroke-width="0.5" transform="rotate(150, 170, 170)"/>
        <line x1="170" y1="6" x2="170" y2="12" stroke="#8b6f47" stroke-width="0.5" transform="rotate(180, 170, 170)"/>
        <line x1="170" y1="6" x2="170" y2="12" stroke="#8b6f47" stroke-width="0.5" transform="rotate(210, 170, 170)"/>
        <line x1="170" y1="6" x2="170" y2="12" stroke="#8b6f47" stroke-width="0.5" transform="rotate(240, 170, 170)"/>
        <line x1="170" y1="6" x2="170" y2="12" stroke="#8b6f47" stroke-width="0.5" transform="rotate(270, 170, 170)"/>
        <line x1="170" y1="6" x2="170" y2="12" stroke="#8b6f47" stroke-width="0.5" transform="rotate(300, 170, 170)"/>
        <line x1="170" y1="6" x2="170" y2="12" stroke="#8b6f47" stroke-width="0.5" transform="rotate(330, 170, 170)"/>
      </g>

      <!-- Sign glyphs around the outer ring -->
      <!-- Aries at top (0°/360°) -->
      <text x="170" y="30" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" fill="#8b6f47" opacity="0.6">&#x2648;</text>
      <!-- Taurus -->
      <text x="252" y="55" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" fill="#8b6f47" opacity="0.6">&#x2649;</text>
      <!-- Gemini -->
      <text x="305" y="110" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" fill="#8b6f47" opacity="0.6">&#x264A;</text>
      <!-- Cancer -->
      <text x="325" y="175" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" fill="#8b6f47" opacity="0.6">&#x264B;</text>
      <!-- Leo -->
      <text x="305" y="240" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" fill="#8b6f47" opacity="0.6">&#x264C;</text>
      <!-- Virgo -->
      <text x="252" y="295" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" fill="#8b6f47" opacity="0.6">&#x264D;</text>
      <!-- Libra -->
      <text x="170" y="318" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" fill="#8b6f47" opacity="0.6">&#x264E;</text>
      <!-- Scorpio -->
      <text x="88" y="295" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" fill="#8b6f47" opacity="0.6">&#x264F;</text>
      <!-- Sagittarius -->
      <text x="35" y="240" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" fill="#8b6f47" opacity="0.6">&#x2650;</text>
      <!-- Capricorn -->
      <text x="15" y="175" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" fill="#8b6f47" opacity="0.6">&#x2651;</text>
      <!-- Aquarius -->
      <text x="35" y="110" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" fill="#8b6f47" opacity="0.6">&#x2652;</text>
      <!-- Pisces -->
      <text x="88" y="55" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" fill="#8b6f47" opacity="0.6">&#x2653;</text>

      <!-- Inner ring -->
      <circle cx="170" cy="170" r="100" fill="none" stroke="#8b6f47" stroke-width="0.3" opacity="0.2"/>
    </svg>

    <!-- Center text -->
    <div style="position: relative; z-index: 1; text-align: center; padding: 20px;">
      <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 11px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; color: #8b6f47; opacity: 0.5; margin-bottom: 16px;">The</div>
      <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 38px; font-weight: 300; letter-spacing: 1px; color: #3d3428; line-height: 1.1;">Solar</div>
      <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 38px; font-weight: 300; letter-spacing: 1px; color: #3d3428; line-height: 1.1;">Journal</div>
      <div style="width: 40px; height: 1px; background: #8b6f47; opacity: 0.3; margin: 16px auto;"></div>
      <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 13px; font-weight: 300; letter-spacing: 2px; color: #8b6f47; opacity: 0.5;">1&#176; &#x2014; 360&#176;</div>
    </div>
  </div>

  <!-- Bottom text -->
  <div style="position: absolute; bottom: 56px; text-align: center;">
    <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 9px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; color: #8b6f47; opacity: 0.35;">A record in natural time</div>
  </div>
</div>
</x-dc>
</body>
</html>
