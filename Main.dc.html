<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
    body { margin: 0; font-family: 'IBM Plex Sans', 'Helvetica Neue', sans-serif; }
    a { color: #8b6f47; } a:hover { color: #6b5534; }
  </style>
</helmet>
<div style="width: 612px; height: 792px; background: #f5f0e8; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden;">

  <!-- Subtle radial texture -->
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(139,111,71,0.06) 0%, transparent 70%);"></div>

  <!-- Sine wave sigil -->
  <div style="position: relative; width: 420px; height: 180px; display: flex; align-items: center; justify-content: center;">
    <svg viewBox="0 0 420 180" width="420" height="180" style="position: absolute; inset: 0;">

      <!-- Tropic of Cancer (upper bound) -->
      <line x1="10" y1="20" x2="410" y2="20" stroke="#8b6f47" stroke-width="0.3" opacity="0.1" stroke-dasharray="3 3"/>

      <!-- Equator (center line) -->
      <line x1="10" y1="90" x2="410" y2="90" stroke="#8b6f47" stroke-width="0.4" opacity="0.15"/>

      <!-- Tropic of Capricorn (lower bound) -->
      <line x1="10" y1="160" x2="410" y2="160" stroke="#8b6f47" stroke-width="0.3" opacity="0.1" stroke-dasharray="3 3"/>

      <!-- Sine wave: x = 20 + (deg/360)*380, y = 90 - 70*sin(deg*pi/180) -->
      <polyline fill="none" stroke="#8b6f47" stroke-width="0.8" opacity="0.4" points="
        20,90
        30.6,77.9
        41.1,66.3
        51.7,55.8
        62.2,46.9
        72.8,40
        83.3,35.1
        93.9,32.4
        104.4,32.1
        115,34.1
        125.6,38.5
        136.1,44.9
        146.7,53.2
        157.2,62.9
        167.8,73.7
        178.3,85.1
        188.9,96.6
        199.4,107.7
        210,118
        220.6,127
        231.1,134.4
        241.7,139.8
        252.2,143.1
        262.8,143.9
        273.3,142.4
        283.9,138.5
        294.4,132.5
        305,124.9
        315.6,115.8
        326.1,105.6
        336.7,94.9
        347.2,83.7
        357.8,73.1
        368.3,63.2
        378.9,54.9
        389.4,48.2
        400,43.5
      "/>

      <!-- Sign glyphs along the wave, very faint -->
      <text x="25" y="84" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.18">&#x2648;</text>
      <text x="57" y="56" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.18">&#x2649;</text>
      <text x="89" y="40" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.18">&#x264A;</text>
      <text x="120" y="40" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.18">&#x264B;</text>
      <text x="152" y="56" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.18">&#x264C;</text>
      <text x="184" y="84" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.18">&#x264D;</text>
      <text x="215" y="108" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.18">&#x264E;</text>
      <text x="247" y="135" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.18">&#x264F;</text>
      <text x="278" y="144" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.18">&#x2650;</text>
      <text x="310" y="135" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.18">&#x2651;</text>
      <text x="342" y="108" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.18">&#x2652;</text>
      <text x="373" y="84" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#8b6f47" opacity="0.18">&#x2653;</text>

      <!-- Cardinal dots -->
      <circle cx="20"  cy="90"   r="1.5" fill="#8b6f47" opacity="0.2"/>
      <circle cx="115" cy="32.1" r="1.5" fill="#8b6f47" opacity="0.2"/>
      <circle cx="210" cy="118"  r="1" fill="#8b6f47" opacity="0.15"/>
      <circle cx="262.8" cy="143.9" r="1.5" fill="#8b6f47" opacity="0.2"/>
      <circle cx="400" cy="43.5" r="1" fill="#8b6f47" opacity="0.15"/>
    </svg>
  </div>

  <!-- Title text below the sigil -->
  <div style="position: relative; z-index: 1; text-align: center; margin-top: 28px;">
    <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 11px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; color: #8b6f47; opacity: 0.5; margin-bottom: 16px;">The</div>
    <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 38px; font-weight: 300; letter-spacing: 1px; color: #3d3428; line-height: 1.1;">Solar</div>
    <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 38px; font-weight: 300; letter-spacing: 1px; color: #3d3428; line-height: 1.1;">Journal</div>
    <div style="width: 40px; height: 1px; background: #8b6f47; opacity: 0.3; margin: 16px auto;"></div>
    <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 13px; font-weight: 300; letter-spacing: 2px; color: #8b6f47; opacity: 0.5;">1&#176;&#8211;360&#176;</div>
  </div>

  <!-- Bottom text -->
  <div style="position: absolute; bottom: 56px; text-align: center;">
    <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 9px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; color: #8b6f47; opacity: 0.35;">A record in natural time</div>
  </div>
</div>
</x-dc>
</body>
</html>
