<x-dc>
<helmet>

    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
    body { margin: 0; font-family: 'IBM Plex Sans', 'Helvetica Neue', sans-serif; }

<div style="width: 612px; height: 792px; background: #f5f0e8; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <!-- Main content area -->

    <!-- Sign glyph - large, quiet -->

      <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 56px; font-weight: 300; color: #8b6f47; opacity: 0.35; line-height: 1;">&#x2648;</div>

    <div style="margin-bottom: 8px;">
      <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 36px; font-weight: 300; color: #3d3428; letter-spacing: 1px; line-height: 1.1;">Aries</div>
    </div>
    <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 300; color: #8b6f47; opacity: 0.6; letter-spacing: 1px;">1&#176;&#8211;30&#176;</div>

    <div style="width: 40px; height: 1px; background: #8b6f47; opacity: 0.2; margin: 28px 0;"></div>

      </div>
      <div>
        <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 8px; font-weight: 400; color: #8b6f47; opacity: 0.45; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px;">Quality</div>
        <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 16px; font-weight: 400; color: #3d3428; opacity: 0.75;">Cardinal fire</div>
      </div>

        <div style="font-family: 'IBM Plex Sans', sans-serif; font-size: 8px; font-weight: 400; color: #8b6f47; opacity: 0.45; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px;">Threshold</div>

        <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 16px; font-weight: 400; color: #3d3428; opacity: 0.75;">Days lengthening</div>

    </div>
